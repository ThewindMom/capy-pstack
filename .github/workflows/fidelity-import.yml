name: Verify and publish faithful pstack revision
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pstack-fidelity-import
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ThewindMom/capy-pstack' && contains(github.event.head_commit.message, '[apply-fidelity]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PSTACK_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          submodules: false
      - name: Apply reviewed edits to the exact parent revision
        shell: python
        run: |
          import base64, hashlib, json, lzma, os, subprocess
          from pathlib import Path, PurePosixPath
          base = 'a47db2463eef1a56db3b4b9579ba3ea7d4d279ea'
          assert subprocess.check_output(['git','rev-parse','HEAD^'], text=True).strip() == base
          assert subprocess.check_output(['git','rev-parse',base+'^{tree}'], text=True).strip() == '1c6740c346e0aeb7c2a73cf982e5c166587e300a'
          encoded = ''.join(Path(f'.ci/fidelity-{i}.b64').read_text() for i in range(1,7))
          assert hashlib.sha256(encoded.encode()).hexdigest() == 'dd9adb173884f938a87145c95a07c6ad1329fb902a91112b6c8f90640721881c'
          raw = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '8c9f0876d03dab921ca7e992a7915ef1c67975576f03014d5e8f4dd849bbc693'
          edits = json.loads(raw)
          assert len(edits) == 48
          executable = {'.agents/skills/control-cli/scripts/pty_probe.py', '.agents/skills/control-ui/scripts/browser_probe.py'}
          for name, replacements in edits.items():
              rel = PurePosixPath(name)
              assert not rel.is_absolute() and not set(rel.parts) & {'..', '.', '.git'}
              assert rel.parts[0] in {'.agents','docs','tests','examples','tools'} or name in {'README.md','NOTICE','pstack.json','.github/workflows/test.yml'}
              path = Path(name)
              assert not any(p.is_symlink() for p in [path, *path.parents])
              old = path.read_text() if path.exists() else ''
              source = subprocess.run(['git','show',base+':'+name], capture_output=True)
              assert old == (source.stdout.decode() if source.returncode == 0 else '')
              mode = path.stat().st_mode & 0o777 if path.exists() else (0o755 if name in executable else 0o644)
              previous = 0
              for start, end, text in replacements:
                  assert type(start) is int and type(end) is int and previous <= start <= end <= len(old) and isinstance(text, str)
                  previous = end
              new = old
              for start, end, text in reversed(replacements):
                  new = new[:start] + text + new[end:]
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(new)
              path.chmod(mode)
          subprocess.run(['python3','tools/catalog.py'], check=True)
          for i in range(1,7): Path(f'.ci/fidelity-{i}.b64').unlink()
          Path('.github/workflows/fidelity-import.yml').unlink()
          subprocess.run(['git','add','-A'], check=True)
          actual = subprocess.check_output(['git','write-tree'], text=True).strip()
          assert actual == '8f87103e09178ec3e870ca17f1a0761b74939c10', actual
          print('Exact reviewed tree verified:', actual)
      - name: Install optional browser test dependency
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Run Python behavior and distribution tests
        run: |
          python3 tools/catalog.py --check
          python3 -m unittest discover -s tests -v
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Run bundled Bun utilities and strict type checking
        working-directory: .agents/skills/poteto-mode/scripts
        run: |
          bun install --frozen-lockfile
          bun test orch watch-pr
          bun run typecheck
      - name: Commit the verified ordinary source files
        run: |
          test "$(git write-tree)" = 8f87103e09178ec3e870ca17f1a0761b74939c10
          git diff --exit-code
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: restore faithful model selection and complete Capy control workflows'
          git push origin HEAD:main
